name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Absent secrets are a supported configuration, not a failure: the app is
      # designed to build and run with no Igor endpoint, collecting locally and
      # queueing. That is what a fork or an untrusted PR gets, since GitHub
      # withholds secrets from those by design.
      - name: Write local.properties (Igor config)
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        run: |
          cat >> local.properties <<EOF
          IGOR_BASE_URL=$IGOR_BASE_URL
          IGOR_API_KEY=$IGOR_API_KEY
          EOF

      - name: Write google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Firebase config written — push wake compiled in."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without Firebase."
          fi

      # Non-fatal by design: this reports whether the ingest endpoint the app
      # exists to feed is reachable with the configured key. A red cross here
      # would mean "the network was down", not "the code is wrong".
      - name: Smoke-test the ingest endpoint
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        continue-on-error: true
        run: |
          if [ -z "$IGOR_BASE_URL" ]; then
            echo "IGOR_BASE_URL not set; skipping reachability check."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "X-API-Key: $IGOR_API_KEY" -H "Accept: application/json" \
            "${IGOR_BASE_URL%/}/health/status")
          echo "GET /health/status -> HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Igor reachable and key accepted."
          else
            echo "::warning::Igor did not return 2xx (got $code). The app still builds and queues locally; this step never fails the build."
          fi

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atomix-wear-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # R8 full mode and lintVitalRelease run ONLY on the release variant, so the
  # debug job above cannot see the failures they produce — a reflection-only
  # class getting stripped, or a lint error that is fatal for release and a
  # warning for debug. This job needs no secrets and publishes nothing; its only
  # purpose is to guarantee that pushing to main will not fail in release.yml.
  release-path:
    name: Release path (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties (Igor config)
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        run: |
          cat >> local.properties <<EOF
          IGOR_BASE_URL=$IGOR_BASE_URL
          IGOR_API_KEY=$IGOR_API_KEY
          EOF

      - name: Write google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: Lint (release-vital)
        run: ./gradlew lintVitalRelease --no-daemon

      - name: Assemble release (R8 + resource shrinking)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-release
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
